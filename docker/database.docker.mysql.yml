default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: 5

production:
  <<: *default
  host: <%= ENV["MYSQL_HOST"] %>
  database: <%= ENV["MYSQL_DATABASE"] %>
  username: <%= ENV["MYSQL_USER"] %>
  password: <%= ENV["MYSQL_PASSWORD"] %>
<% if ENV["MYSQL_SSL_CA"].present? %>
  ssl_mode: verify_identity
  sslca: <%= ENV["MYSQL_SSL_CA"] %>
<% end %>
