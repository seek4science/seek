config:
  aws:region: eu-west-2
  aws:defaultTags:
    tags:
      Environment: staging
      ManagedBy: pulumi
  biofair-mc-workflow-hub:environment: staging
  biofair-mc-workflow-hub:vpcCidr: 10.30.0.0/16

  # Built from the pulumi branch of the SEEK repo and pushed when ready to
  # deploy. Build both images from the same commit, so the Solr configset
  # matches the code.
  biofair-mc-workflow-hub:seekImage: fairdom/seek:workflowhub-pulumi
  biofair-mc-workflow-hub:solrImage: fairdom/seek-solr:pulumi

  biofair-mc-workflow-hub:webCount: "1" # the minimum; raise once the schema exists, see tech-notes.md
  biofair-mc-workflow-hub:webCountMax: "8"
  biofair-mc-workflow-hub:workerCount: "1"
  biofair-mc-workflow-hub:webInstanceType: t3.large
  biofair-mc-workflow-hub:workerInstanceType: t3.large

  biofair-mc-workflow-hub:dbInstanceClass: db.t3.medium
  biofair-mc-workflow-hub:dbAllocatedStorage: "100"
  # Staging is for trials: let `pulumi destroy` delete the database outright.
  biofair-mc-workflow-hub:dbDeletionProtection: "false"
  biofair-mc-workflow-hub:dbSkipFinalSnapshot: "true"
  biofair-mc-workflow-hub:redisNodeType: cache.t4g.small
