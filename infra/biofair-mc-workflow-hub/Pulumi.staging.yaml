config:
  aws:region: eu-west-2
  aws:defaultTags:
    tags:
      Environment: staging
      ManagedBy: pulumi
  biofair-mc-workflow-hub:environment: staging
  biofair-mc-workflow-hub:vpcCidr: 10.30.0.0/16
  biofair-mc-workflow-hub:instanceType: t3.xlarge

  # The compose file, env files and Solr configset come from this ref; the
  # image should match it.
  biofair-mc-workflow-hub:seekRepoRef: main
  biofair-mc-workflow-hub:seekImage: fairdom/seek:main
