name: biofair-mc-workflow-hub-compute
runtime: yaml
description: >-
  AWS infrastructure for the WorkflowHub (SEEK) component of the BioFAIR
  Methods Commons Spoke, in the biofair-mc-workflow-hub account: the
  disposable compute stack, on top of the data stack (../data). The NAT
  gateway, Redis on ElastiCache, Solr on its own EC2 instance, and the
  front-end and workers as Docker containers on EC2 Auto Scaling groups
  behind a load balancer serving HTTPS with a self-signed certificate.
  Destroying it leaves the database, filestore and Solr index untouched.
  Creates no IAM resources.

# See ../README.md for deploying it. Deploy the data stack first, and destroy
# this stack before it.

config:
  # Existing SSM-only instance profile, looked up rather than created.
  ssmInstanceProfileName:
    type: string
    default: ssm-instance-profile
  seekImage:
    type: string
    default: fairdom/seek:main
  # Built from solr/Dockerfile, from the same commit as seekImage.
  solrImage:
    type: string
    default: fairdom/seek-solr:main
  # The fewest web instances; autoscaling adds more, up to webCountMax. Keep
  # at 1 until the schema exists: on an empty database each web container
  # creates it at boot, and several doing so at once would race.
  webCount:
    type: integer
    default: 1
  webCountMax:
    type: integer
    default: 8
  # Average CPU across the web instances that autoscaling aims for. Low,
  # because a new instance takes several minutes to boot and pull the image.
  webCpuTarget:
    type: integer
    default: 50
  workerCount:
    type: integer
    default: 1
  webInstanceType:
    type: string
    default: t3.large
  workerInstanceType:
    type: string
    default: t3.large
  redisNodeType:
    type: string
    default: cache.t4g.small
  solrInstanceType:
    type: string
    default: t3.medium

variables:
  # Names, networking and data stores from the data stack, for the same
  # environment as this stack.
  namePrefix: ${data.outputs["namePrefix"]}
  environment: ${data.outputs["environment"]}
  vpcId: ${data.outputs["vpcId"]}
  publicSubnetIds: ${data.outputs["publicSubnetIds"]}
  privateSubnetIds: ${data.outputs["privateSubnetIds"]}
  albSgId: ${data.outputs["albSgId"]}
  appSgId: ${data.outputs["appSgId"]}
  solrSgId: ${data.outputs["solrSgId"]}
  dataSgId: ${data.outputs["dataSgId"]}
  databaseEndpoint: ${data.outputs["databaseEndpoint"]}
  sharedFsId: ${data.outputs["sharedFsId"]}

  # The private subnets' route tables, which get the default route through
  # the NAT gateway. Looked up here rather than in the data stack, where the
  # lookup could run before the subnets are associated with their tables.
  privateRouteTableA:
    fn::invoke:
      function: aws:ec2:getRouteTable
      arguments:
        subnetId: ${privateSubnetIds[0]}
  privateRouteTableB:
    fn::invoke:
      function: aws:ec2:getRouteTable
      arguments:
        subnetId: ${privateSubnetIds[1]}

  # Solr's name in the VPC's private DNS zone. The web and worker instances
  # use it rather than Solr's IP, so replacing Solr does not change their
  # launch templates and roll them.
  solrHost: solr.seek.internal

  ssmProfile:
    fn::invoke:
      function: aws:iam:getInstanceProfile
      arguments:
        name: ${ssmInstanceProfileName}

  al2023:
    fn::invoke:
      function: aws:ec2:getAmi
      arguments:
        mostRecent: true
        owners: ["amazon"]
        filters:
          - name: name
            values: ["al2023-ami-2023.*-x86_64"]

  # The provider's region, for the instances' Parameter Store and CA bundle
  # lookups.
  region:
    fn::invoke:
      function: aws:getRegion
      return: name

  # First half of the web and worker instances' user data: install Docker,
  # mount the filestore, and write the container environment. Each launch
  # template appends its own `docker run`. NO_ENTRYPOINT_WORKERS and NGINX_TLS
  # are only read by the web entrypoint and QUIET_SUPERCRONIC only by the
  # workers, so one environment serves both. REDIS_TLS, MYSQL_SSL_CA and
  # NGINX_TLS need a SEEK image recent enough to support them; without
  # MYSQL_SSL_CA support, SEEK cannot connect, since the database requires
  # TLS. BOOTSNAP_CACHE_DIR keeps bootsnap's cache in the container, out of
  # the shared file cache on EFS, where instances booting at once (or on
  # different images) leave each other stale NFS handles and Puma fails to
  # start.
  hostSetup: |
    #!/bin/bash
    set -euo pipefail
    dnf install -y docker amazon-efs-utils
    systemctl enable --now docker

    # The filestore and the file cache, each through its access point, so
    # files are owned by www-data (uid 33), the user the SEEK container runs
    # as. Sharing the cache lets any instance serve a large generated file
    # that another has already produced.
    mkdir -p /mnt/filestore /mnt/cache
    echo "${sharedFsId}:/ /mnt/filestore efs _netdev,tls,accesspoint=${data.outputs["filestoreAccessPointId"]} 0 0" >> /etc/fstab
    echo "${sharedFsId}:/ /mnt/cache efs _netdev,tls,accesspoint=${data.outputs["cacheAccessPointId"]} 0 0" >> /etc/fstab
    mount /mnt/filestore
    mount /mnt/cache

    # The SSM instance role can read Parameter Store.
    DB_PASSWORD=$(aws ssm get-parameter --region ${region} --name ${data.outputs["dbPasswordParamName"]} --with-decryption --query Parameter.Value --output text)
    REDIS_PASSWORD=$(aws ssm get-parameter --region ${region} --name ${redisAuthTokenParam.name} --with-decryption --query Parameter.Value --output text)

    # The CA bundle for RDS's certificates, mounted into the container so
    # SEEK connects to MySQL over TLS and verifies the server.
    mkdir -p /etc/seek
    curl -fsS -o /etc/seek/rds-ca.pem https://truststore.pki.rds.amazonaws.com/${region}/${region}-bundle.pem

    # Solr's self-signed certificate, in a directory of trusted certificates
    # mounted into the container as SSL_CERT_DIR. OpenSSL still reads the
    # image's public CAs from its default file, so other HTTPS is unaffected.
    mkdir -p /etc/seek/ca.d
    cat > /etc/seek/ca.d/solr.pem <<'PEM'
    ${solrTlsCert.certPem}
    PEM
    openssl rehash /etc/seek/ca.d

    install -m 600 /dev/null /etc/seek.env
    cat > /etc/seek.env <<EOF
    RAILS_ENV=production
    RAILS_LOG_LEVEL=info
    SOLR_HOST=${solrHost}
    SOLR_PORT=8983
    SOLR_URL=https://${solrHost}:8983/solr/seek
    SSL_CERT_DIR=/etc/seek/ca.d
    MYSQL_HOST=${databaseEndpoint}
    MYSQL_DATABASE=seek_production
    MYSQL_USER=seek
    MYSQL_PASSWORD=$DB_PASSWORD
    MYSQL_SSL_CA=/etc/seek/rds-ca.pem
    REDIS_HOST=${redis.primaryEndpointAddress}
    REDIS_PASSWORD=$REDIS_PASSWORD
    REDIS_TLS=1
    BOOTSNAP_CACHE_DIR=/seek/tmp/bootsnap
    PUMA_WORKERS_NUM=2
    NO_ENTRYPOINT_WORKERS=1
    NGINX_TLS=1
    QUIET_SUPERCRONIC=1
    EOF

resources:
  # The data stack of the same name as this stack (e.g. staging).
  data:
    type: pulumi:pulumi:StackReference
    properties:
      name: organization/biofair-mc-workflow-hub-data/${pulumi.stack}

  # -------------------------------------------------------------------------
  # Outbound internet for the private subnets: one NAT gateway, and a default
  # route through it in each private subnet's route table. Everything that
  # boots here needs it, to install packages and pull its image.
  # -------------------------------------------------------------------------
  natEip:
    type: aws:ec2:Eip
    properties:
      domain: vpc
      tags:
        Name: ${namePrefix}-nat

  natGateway:
    type: aws:ec2:NatGateway
    properties:
      allocationId: ${natEip.allocationId}
      subnetId: ${publicSubnetIds[0]}
      tags:
        Name: ${namePrefix}-nat

  natRouteA:
    type: aws:ec2:Route
    properties:
      routeTableId: ${privateRouteTableA.id}
      destinationCidrBlock: 0.0.0.0/0
      natGatewayId: ${natGateway.id}

  natRouteB:
    type: aws:ec2:Route
    properties:
      routeTableId: ${privateRouteTableB.id}
      destinationCidrBlock: 0.0.0.0/0
      natGatewayId: ${natGateway.id}

  # -------------------------------------------------------------------------
  # Redis: cache, sessions and throttle counters; no durable data, since
  # SEEK's job queue is in MySQL. TLS-only, with an auth token.
  # -------------------------------------------------------------------------
  redisSubnets:
    type: aws:elasticache:SubnetGroup
    properties:
      name: ${namePrefix}-redis-subnets
      subnetIds: ${privateSubnetIds}

  # As in compose. The default policy only evicts keys with an expiry, and
  # SEEK's cache entries mostly have none.
  redisParams:
    type: aws:elasticache:ParameterGroup
    properties:
      name: ${namePrefix}-redis-params
      family: redis7
      parameters:
        - name: maxmemory-policy
          value: allkeys-lru

  # Generated here, so no one chooses it and the stack config holds no copy;
  # it is kept as a secret in the Pulumi state. Letters and digits only, which
  # ElastiCache accepts and SEEK's Redis URL needs no escaping for.
  redisAuthToken:
    type: random:RandomPassword
    properties:
      length: 32
      special: false

  # Read by the web and worker instances at boot.
  redisAuthTokenParam:
    type: aws:ssm:Parameter
    properties:
      name: /${namePrefix}/redis-auth-token
      type: SecureString
      value: ${redisAuthToken.result}

  redis:
    type: aws:elasticache:ReplicationGroup
    properties:
      description: SEEK cache and sessions
      engine: redis
      engineVersion: "7.1"
      nodeType: ${redisNodeType}
      numCacheClusters: 1
      port: 6379
      parameterGroupName: ${redisParams.name}
      subnetGroupName: ${redisSubnets.name}
      securityGroupIds: ["${dataSgId}"]
      atRestEncryptionEnabled: true
      transitEncryptionEnabled: true
      authToken: ${redisAuthToken.result}
    options:
      # A token set when the group is created is required from the start.
      # Changing it in place uses ROTATE, which leaves the new token optional
      # (and adding one to a group that had none still admits clients without
      # it) until a separate SET, so a change replaces the group instead. Redis
      # holds only the cache and sessions, so a replacement logs users out.
      replaceOnChanges: ["authToken"]

  # -------------------------------------------------------------------------
  # Solr: the derived image on an EC2 instance, with the index on the data
  # stack's volume, which a new instance reattaches.
  # -------------------------------------------------------------------------
  # Solr's TLS certificate: self-signed, for the name SEEK uses and for
  # localhost, which Solr's health check uses and Jetty requires the
  # certificate to cover. The web and worker instances trust this certificate
  # itself. A `pulumi up` in its last year replaces it, and the instances pick
  # up the new one when they are next replaced or restarted.
  solrTlsKey:
    type: tls:PrivateKey
    properties:
      algorithm: ECDSA
      ecdsaCurve: P256

  solrTlsCert:
    type: tls:SelfSignedCert
    properties:
      privateKeyPem: ${solrTlsKey.privateKeyPem}
      subject:
        commonName: ${solrHost}
      dnsNames:
        - ${solrHost}
        - localhost
      validityPeriodHours: 87600
      earlyRenewalHours: 8760
      allowedUses:
        - key_encipherment
        - digital_signature
        - server_auth

  # Read by the Solr instance at boot.
  solrTlsKeyParam:
    type: aws:ssm:Parameter
    properties:
      name: /${namePrefix}/solr-tls-key
      type: SecureString
      value: ${solrTlsKey.privateKeyPem}

  solrInstance:
    type: aws:ec2:Instance
    properties:
      ami: ${al2023.id}
      instanceType: ${solrInstanceType}
      # In the data stack's Solr subnet, the AZ of the index volume.
      subnetId: ${data.outputs["solrSubnetId"]}
      vpcSecurityGroupIds: ["${solrSgId}"]
      iamInstanceProfile: ${ssmProfile.name}
      rootBlockDevice:
        volumeSize: 20
        volumeType: gp3
        encrypted: true
        tags:
          Name: ${namePrefix}-solr
      tags:
        Name: ${namePrefix}-solr
      # User data only runs on an instance's first boot, so a change to it
      # replaces the instance rather than restarting it to no effect.
      userDataReplaceOnChange: true
      userData: |
        #!/bin/bash
        set -euo pipefail
        dnf install -y docker
        systemctl enable --now docker

        # The data volume, found by its ID: on Nitro instances the attachment's
        # device name is only a hint. Wait up to ten minutes for it to attach,
        # format it only if it is blank, and mount it at /var/solr by UUID.
        VOL=${data.outputs["solrDataVolumeId"]}
        DEV=/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$(echo "$VOL" | tr -d -)
        for i in $(seq 1 300); do [ -e "$DEV" ] && break; sleep 2; done
        [ -e "$DEV" ]
        blkid "$DEV" || mkfs.ext4 -L solr-data "$DEV"
        UUID=$(blkid -s UUID -o value "$DEV")
        mkdir -p /var/solr
        grep -q "$UUID" /etc/fstab || echo "UUID=$UUID /var/solr ext4 defaults,nofail 0 2" >> /etc/fstab
        mount /var/solr
        chown 8983:8983 /var/solr

        # TLS: the key from Parameter Store and the certificate, in a PKCS12
        # keystore readable by the container's solr user (gid 8983), under a
        # password made for this boot. The key is not kept outside the
        # keystore.
        mkdir -p /etc/solr-tls
        cat > /etc/solr-tls/cert.pem <<'PEM'
        ${solrTlsCert.certPem}
        PEM
        KEY=$(mktemp)
        aws ssm get-parameter --region ${region} --name ${solrTlsKeyParam.name} --with-decryption --query Parameter.Value --output text > "$KEY"
        KEYSTORE_PASSWORD=$(openssl rand -hex 16)
        openssl pkcs12 -export -in /etc/solr-tls/cert.pem -inkey "$KEY" -name solr \
          -out /etc/solr-tls/keystore.p12 -passout "pass:$KEYSTORE_PASSWORD"
        rm -f "$KEY"
        chown root:8983 /etc/solr-tls/keystore.p12
        chmod 640 /etc/solr-tls/keystore.p12

        docker run -d --restart always --name solr \
          -p 8983:8983 \
          -v /var/solr:/var/solr \
          -v /etc/solr-tls/keystore.p12:/etc/solr-tls/keystore.p12:ro \
          -e SOLR_JAVA_MEM="-Xms512m -Xmx1024m" \
          -e SOLR_SSL_ENABLED=true \
          -e SOLR_SSL_KEY_STORE=/etc/solr-tls/keystore.p12 \
          -e SOLR_SSL_KEY_STORE_TYPE=PKCS12 \
          -e SOLR_SSL_KEY_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
          -e SOLR_SSL_TRUST_STORE=/etc/solr-tls/keystore.p12 \
          -e SOLR_SSL_TRUST_STORE_TYPE=PKCS12 \
          -e SOLR_SSL_TRUST_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
          -e SOLR_SSL_NEED_CLIENT_AUTH=false \
          -e SOLR_SSL_WANT_CLIENT_AUTH=false \
          ${solrImage}
    options:
      # The AMI lookup returns the newest image, which would otherwise replace
      # the instance whenever Amazon publishes one. Replacing it is safe, but
      # means a search outage while the new instance boots, so it is left to a
      # deliberate `pulumi up --replace`.
      ignoreChanges: ["ami"]
      # The data volume can only be attached to one instance, so a replacement
      # must detach it and delete the old instance before creating the new.
      deleteBeforeReplace: true
      dependsOn:
        - ${natRouteA}
        - ${natRouteB}

  solrAttach:
    type: aws:ec2:VolumeAttachment
    properties:
      deviceName: /dev/sdf
      volumeId: ${data.outputs["solrDataVolumeId"]}
      instanceId: ${solrInstance.id}
      # Stop Solr cleanly rather than pull the disk from under it.
      stopInstanceBeforeDetaching: true
    options:
      deleteBeforeReplace: true

  solrRecord:
    type: aws:route53:Record
    properties:
      zoneId: ${data.outputs["internalZoneId"]}
      name: ${solrHost}
      type: A
      ttl: 60
      records:
        - ${solrInstance.privateIp}

  # -------------------------------------------------------------------------
  # Load balancer, and the web and worker Auto Scaling groups. The instances
  # use the existing SSM instance profile.
  #
  # A change to a launch template, including a new AMI from the lookup above,
  # rolls the group's instances: each new one boots and pulls the image
  # before the old one is terminated.
  # -------------------------------------------------------------------------
  # A self-signed certificate for HTTPS until there is a real domain, so
  # browsers warn. Generated here and imported into ACM; the private key is
  # held encrypted in the Pulumi state.
  tlsKey:
    type: tls:PrivateKey
    properties:
      algorithm: RSA
      rsaBits: 2048

  tlsCert:
    type: tls:SelfSignedCert
    properties:
      privateKeyPem: ${tlsKey.privateKeyPem}
      # The load balancer only accepts certificates for a fully qualified
      # domain name; any will do for a self-signed one.
      subject:
        commonName: ${namePrefix}.seek.internal
      dnsNames:
        - ${namePrefix}.seek.internal
      validityPeriodHours: 8760
      allowedUses:
        - key_encipherment
        - digital_signature
        - server_auth

  certificate:
    type: aws:acm:Certificate
    properties:
      privateKey: ${tlsKey.privateKeyPem}
      certificateBody: ${tlsCert.certPem}

  # HTTPS on 443; plain HTTP on 80 redirects to it. The connection on to the
  # web instances is HTTPS too (NGINX_TLS): the container's certificate is
  # self-signed, which the load balancer accepts, as it does not verify
  # target certificates.
  alb:
    type: awsx:lb:ApplicationLoadBalancer
    properties:
      subnetIds: ${publicSubnetIds}
      securityGroups: ["${albSgId}"]
      listeners:
        - port: 80
          protocol: HTTP
          defaultActions:
            - type: redirect
              redirect:
                port: "443"
                protocol: HTTPS
                statusCode: HTTP_301
        - port: 443
          protocol: HTTPS
          certificateArn: ${certificate.arn}
      defaultTargetGroup:
        port: 3000
        protocol: HTTPS
        targetType: instance
        vpcId: ${vpcId}
        deregistrationDelay: 30
        healthCheck:
          protocol: HTTPS
          path: /up
          interval: 30
          timeout: 5
          healthyThreshold: 2
          unhealthyThreshold: 5
          matcher: "200"

  webLaunchTemplate:
    type: aws:ec2:LaunchTemplate
    properties:
      namePrefix: ${namePrefix}-web-
      imageId: ${al2023.id}
      instanceType: ${webInstanceType}
      iamInstanceProfile:
        arn: ${ssmProfile.arn}
      vpcSecurityGroupIds: ["${appSgId}"]
      blockDeviceMappings:
        - deviceName: /dev/xvda
          ebs:
            volumeSize: 30
            volumeType: gp3
            encrypted: "true"
            deleteOnTermination: "true"
      metadataOptions:
        httpTokens: required
      tagSpecifications:
        - resourceType: instance
          tags:
            Name: ${namePrefix}-web
            Environment: ${environment}
            ManagedBy: pulumi
        - resourceType: volume
          tags:
            Name: ${namePrefix}-web
            Environment: ${environment}
            ManagedBy: pulumi
      userData:
        fn::toBase64:
          fn::join:
            - ""
            - - ${hostSetup}
              - |
                docker run -d --restart always --name seek --env-file /etc/seek.env \
                  -p 3000:3000 -v /mnt/filestore:/seek/filestore -v /mnt/cache:/seek/tmp/cache \
                  -v /etc/seek/rds-ca.pem:/etc/seek/rds-ca.pem:ro \
                  -v /etc/seek/ca.d:/etc/seek/ca.d:ro \
                  ${seekImage} docker/entrypoint.sh

  webGroup:
    type: aws:autoscaling:Group
    properties:
      name: ${namePrefix}-web
      # No desiredCapacity: autoscaling owns it, starting at minSize.
      minSize: ${webCount}
      maxSize: ${webCountMax}
      vpcZoneIdentifiers: ${privateSubnetIds}
      targetGroupArns: ["${alb.defaultTargetGroup.arn}"]
      # SEEK's first boot creates the database, which takes a while.
      healthCheckType: ELB
      healthCheckGracePeriod: 900
      # Leave a new instance out of the CPU average while it boots, so its
      # start-up does not trigger further scaling. A new web instance is
      # healthy within about five minutes.
      defaultInstanceWarmup: 300
      launchTemplate:
        id: ${webLaunchTemplate.id}
        version: ${webLaunchTemplate.latestVersion}
      instanceRefresh:
        strategy: Rolling
        preferences:
          minHealthyPercentage: 100
          maxHealthyPercentage: 200
    options:
      dependsOn:
        - ${natRouteA}
        - ${natRouteB}

  # Adds web instances when average CPU is above webCpuTarget, and removes
  # them when it is well below.
  webScalePolicy:
    type: aws:autoscaling:Policy
    properties:
      name: ${namePrefix}-web-cpu
      autoscalingGroupName: ${webGroup.name}
      policyType: TargetTrackingScaling
      targetTrackingConfiguration:
        predefinedMetricSpecification:
          predefinedMetricType: ASGAverageCPUUtilization
        targetValue: ${webCpuTarget}

  workerLaunchTemplate:
    type: aws:ec2:LaunchTemplate
    properties:
      namePrefix: ${namePrefix}-worker-
      imageId: ${al2023.id}
      instanceType: ${workerInstanceType}
      iamInstanceProfile:
        arn: ${ssmProfile.arn}
      vpcSecurityGroupIds: ["${appSgId}"]
      blockDeviceMappings:
        - deviceName: /dev/xvda
          ebs:
            volumeSize: 30
            volumeType: gp3
            encrypted: "true"
            deleteOnTermination: "true"
      metadataOptions:
        httpTokens: required
      tagSpecifications:
        - resourceType: instance
          tags:
            Name: ${namePrefix}-worker
            Environment: ${environment}
            ManagedBy: pulumi
        - resourceType: volume
          tags:
            Name: ${namePrefix}-worker
            Environment: ${environment}
            ManagedBy: pulumi
      userData:
        fn::toBase64:
          fn::join:
            - ""
            - - ${hostSetup}
              - |
                docker run -d --restart always --name seek-workers --env-file /etc/seek.env \
                  -v /mnt/filestore:/seek/filestore -v /mnt/cache:/seek/tmp/cache \
                  -v /etc/seek/rds-ca.pem:/etc/seek/rds-ca.pem:ro \
                  -v /etc/seek/ca.d:/etc/seek/ca.d:ro \
                  ${seekImage} docker/start_workers.sh

  workerGroup:
    type: aws:autoscaling:Group
    properties:
      name: ${namePrefix}-worker
      minSize: ${workerCount}
      maxSize: ${workerCount}
      desiredCapacity: ${workerCount}
      vpcZoneIdentifiers: ${privateSubnetIds}
      healthCheckType: EC2
      launchTemplate:
        id: ${workerLaunchTemplate.id}
        version: ${workerLaunchTemplate.latestVersion}
      instanceRefresh:
        strategy: Rolling
        preferences:
          minHealthyPercentage: 100
          maxHealthyPercentage: 200
    options:
      dependsOn:
        - ${natRouteA}
        - ${natRouteB}

outputs:
  url: https://${alb.loadBalancer.dnsName}
  databaseEndpoint: ${databaseEndpoint}
  redisEndpoint: ${redis.primaryEndpointAddress}
  sharedFsId: ${sharedFsId}
  webGroupName: ${webGroup.name}
  workerGroupName: ${workerGroup.name}
  solrPrivateIp: ${solrInstance.privateIp}
