name: biofair-mc-workflow-hub
runtime: yaml
description: >-
  AWS infrastructure for the WorkflowHub (SEEK) component of the BioFAIR
  Methods Commons Spoke, in the biofair-mc-workflow-hub account. Phase 1: one
  EC2 instance running SEEK's docker-compose.yml unchanged, reached through
  SSM.

# The alternative, managed-services design is described in
# docs/SEEK-pulumi-handover.md.

config:
  environment:
    type: string
    description: Environment name (staging, production), used in resource names.
  vpcCidr:
    type: string
  ssmInstanceProfileName:
    type: string
    default: ssm-instance-profile
    description: Existing SSM-only instance profile, looked up rather than created.
  instanceType:
    type: string
    default: t3.xlarge
    description: >
      Runs every compose service (SEEK, workers, MySQL, Solr, Redis) on one
      machine, so sized larger than any single service would need.
  seekRepoRef:
    type: string
    default: main
    description: >
      Branch or tag of github.com/seek4science/seek to clone for
      docker-compose.yml, its env files and the Solr configset.
  seekImage:
    type: string
    default: fairdom/seek:main
    description: SEEK image the compose file runs; match it to seekRepoRef.

variables:
  # e.g. biofair-mc-workflow-hub-staging
  namePrefix: ${pulumi.project}-${environment}

  ssmProfile:
    fn::invoke:
      function: aws:iam:getInstanceProfile
      arguments:
        name: ${ssmInstanceProfileName}

  # Ubuntu 24.04 LTS, as biofair-mc-infra's components use.
  ubuntu:
    fn::invoke:
      function: aws:ec2:getAmi
      arguments:
        mostRecent: true
        owners: ["099720109477"] # Canonical
        filters:
          - name: name
            values: ["ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*"]
          - name: state
            values: ["available"]

resources:
  # Two AZs, public and private subnets, a single NAT gateway for outbound
  # access (package installs, git clone, image pulls).
  vpc:
    type: awsx:ec2:Vpc
    properties:
      cidrBlock: ${vpcCidr}
      numberOfAvailabilityZones: 2
      natGateways:
        strategy: Single
      tags:
        Name: ${namePrefix}

  # No inbound rules: SSH is forbidden org-wide, and SSM needs no inbound port.
  sg:
    type: aws:ec2:SecurityGroup
    properties:
      vpcId: ${vpc.vpcId}
      description: SEEK instance, SSM-only, no inbound
      egress:
        - protocol: "-1"
          fromPort: 0
          toPort: 0
          cidrBlocks: ["0.0.0.0/0"]
      tags:
        Name: ${namePrefix}-sg

  # Everything, including MySQL data, the filestore and the Solr index, lives
  # in Docker volumes on the root volume.
  seek:
    type: aws:ec2:Instance
    properties:
      ami: ${ubuntu.id}
      instanceType: ${instanceType}
      subnetId: ${vpc.privateSubnetIds[0]}
      vpcSecurityGroupIds: ["${sg.id}"]
      iamInstanceProfile: ${ssmProfile.name}
      rootBlockDevice:
        volumeSize: 100
        volumeType: gp3
        encrypted: true
      tags:
        Name: ${namePrefix}-seek
      userData: |
        #!/bin/bash
        set -euxo pipefail
        apt-get update
        apt-get install -y docker.io docker-compose-v2 git
        systemctl enable --now docker

        git clone --depth 1 --branch ${seekRepoRef} https://github.com/seek4science/seek.git /opt/seek
        cd /opt/seek

        # The compose file declares its volumes as external.
        for v in seek-filestore seek-mysql-db seek-solr-data seek-cache seek-redis-data; do
          docker volume create "$v"
        done

        cat > docker-compose.override.yml <<'EOF'
        services:
          seek:
            image: ${seekImage}
          seek_workers:
            image: ${seekImage}
        EOF

        docker compose up -d
    options:
      # userData only runs on first boot, and the AMI lookup returns the newest
      # image. Either change would otherwise replace the instance and lose
      # everything on it.
      ignoreChanges: ["ami", "userData"]

outputs:
  instanceId: ${seek.id}
  privateIp: ${seek.privateIp}
