name: biofair-mc-workflow-hub
runtime: yaml
description: >-
  AWS infrastructure for the WorkflowHub (SEEK) component of the BioFAIR
  Methods Commons Spoke, in the biofair-mc-workflow-hub account. Phase 1:
  front-end and workers as Docker containers on EC2 Auto Scaling groups,
  MySQL on RDS, Redis on ElastiCache, filestore on EFS, and Solr on its own
  EC2 instance, served over HTTP at the load balancer's own hostname. Creates
  no IAM resources.

# Design decisions, referred to below by section number ("handover 4.4"), are
# in docs/SEEK-pulumi-handover.md. What phase 2 adds is listed in README.md.

config:
  # Environment name (staging, production), used in resource names.
  environment:
    type: string
  vpcCidr:
    type: string
  # Existing SSM-only instance profile, looked up rather than created.
  ssmInstanceProfileName:
    type: string
    default: ssm-instance-profile
  seekImage:
    type: string
    default: fairdom/seek:main
  # Built from solr/Dockerfile; use the same tag as seekImage.
  solrImage:
    type: string
    default: fairdom/seek-solr:main
  # Keep at 1 until the schema exists (handover 4.4).
  webCount:
    type: integer
    default: 1
  workerCount:
    type: integer
    default: 1
  webInstanceType:
    type: string
    default: t3.large
  workerInstanceType:
    type: string
    default: t3.large
  dbInstanceClass:
    type: string
    default: db.t4g.medium
  dbAllocatedStorage:
    type: integer
    default: 100
  redisNodeType:
    type: string
    default: cache.t4g.small
  solrInstanceType:
    type: string
    default: t3.medium
  dbPassword:
    type: string
    secret: true

variables:
  # e.g. biofair-mc-workflow-hub-staging
  namePrefix: ${pulumi.project}-${environment}

  ssmProfile:
    fn::invoke:
      function: aws:iam:getInstanceProfile
      arguments:
        name: ${ssmInstanceProfileName}

  al2023:
    fn::invoke:
      function: aws:ec2:getAmi
      arguments:
        mostRecent: true
        owners: ["amazon"]
        filters:
          - name: name
            values: ["al2023-ami-2023.*-x86_64"]

  # First half of the web and worker instances' user data: install Docker,
  # mount the filestore, and write the container environment. Each launch
  # template appends its own `docker run`. NO_ENTRYPOINT_WORKERS is only read
  # by the web entrypoint and QUIET_SUPERCRONIC only by the workers, so one
  # environment serves both. REDIS_TLS needs a SEEK image with handover
  # change 5.1.
  hostSetup: |
    #!/bin/bash
    set -euo pipefail
    dnf install -y docker amazon-efs-utils
    systemctl enable --now docker

    # Through the access point, so files are owned by www-data (uid 33), as
    # the container expects (handover 4.2).
    mkdir -p /mnt/filestore
    echo "${sharedFs.id}:/ /mnt/filestore efs _netdev,tls,accesspoint=${filestoreAccessPoint.id} 0 0" >> /etc/fstab
    mount /mnt/filestore

    # The SSM instance role can read Parameter Store.
    TOKEN=$(curl -sX PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
    REGION=$(curl -sH "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region)
    DB_PASSWORD=$(aws ssm get-parameter --region "$REGION" --name ${dbPasswordParam.name} --with-decryption --query Parameter.Value --output text)

    install -m 600 /dev/null /etc/seek.env
    cat > /etc/seek.env <<EOF
    RAILS_ENV=production
    RAILS_LOG_LEVEL=info
    SOLR_HOST=${solrInstance.privateIp}
    SOLR_PORT=8983
    MYSQL_HOST=${db.address}
    MYSQL_DATABASE=seek_production
    MYSQL_USER=seek
    MYSQL_PASSWORD=$DB_PASSWORD
    REDIS_HOST=${redis.primaryEndpointAddress}
    REDIS_TLS=1
    PUMA_WORKERS_NUM=2
    NO_ENTRYPOINT_WORKERS=1
    QUIET_SUPERCRONIC=1
    EOF

resources:
  # -------------------------------------------------------------------------
  # Networking: two AZs, public and private subnets, a single NAT gateway.
  # -------------------------------------------------------------------------
  vpc:
    type: awsx:ec2:Vpc
    properties:
      cidrBlock: ${vpcCidr}
      numberOfAvailabilityZones: 2
      natGateways:
        strategy: Single
      tags:
        Name: ${namePrefix}

  albSg:
    type: aws:ec2:SecurityGroup
    properties:
      name: ${namePrefix}-alb-sg
      vpcId: ${vpc.vpcId}
      description: Public ingress to the load balancer
      ingress:
        - protocol: tcp
          fromPort: 80
          toPort: 80
          cidrBlocks: ["0.0.0.0/0"]
      egress:
        - protocol: "-1"
          fromPort: 0
          toPort: 0
          cidrBlocks: ["0.0.0.0/0"]

  # Web, workers and Solr. The data stores admit this group.
  appSg:
    type: aws:ec2:SecurityGroup
    properties:
      name: ${namePrefix}-app-sg
      vpcId: ${vpc.vpcId}
      description: SEEK application tasks and Solr
      egress:
        - protocol: "-1"
          fromPort: 0
          toPort: 0
          cidrBlocks: ["0.0.0.0/0"]

  appFromAlb:
    type: aws:ec2:SecurityGroupRule
    properties:
      type: ingress
      securityGroupId: ${appSg.id}
      sourceSecurityGroupId: ${albSg.id}
      protocol: tcp
      fromPort: 3000
      toPort: 3000

  appToSolr:
    type: aws:ec2:SecurityGroupRule
    properties:
      type: ingress
      securityGroupId: ${appSg.id}
      sourceSecurityGroupId: ${appSg.id}
      protocol: tcp
      fromPort: 8983
      toPort: 8983

  dataSg:
    type: aws:ec2:SecurityGroup
    properties:
      name: ${namePrefix}-data-sg
      vpcId: ${vpc.vpcId}
      description: RDS, ElastiCache and EFS, reachable only from appSg
      ingress:
        - protocol: tcp
          fromPort: 3306
          toPort: 3306
          securityGroups: ["${appSg.id}"]
        - protocol: tcp
          fromPort: 6379
          toPort: 6379
          securityGroups: ["${appSg.id}"]
        - protocol: tcp
          fromPort: 2049
          toPort: 2049
          securityGroups: ["${appSg.id}"]
      egress:
        - protocol: "-1"
          fromPort: 0
          toPort: 0
          cidrBlocks: ["0.0.0.0/0"]

  # -------------------------------------------------------------------------
  # MySQL
  # -------------------------------------------------------------------------
  # Read at boot by the web and worker instances.
  dbPasswordParam:
    type: aws:ssm:Parameter
    properties:
      name: /${namePrefix}/db-password
      type: SecureString
      value: ${dbPassword}

  dbSubnets:
    type: aws:rds:SubnetGroup
    properties:
      name: ${namePrefix}-db-subnets
      subnetIds: ${vpc.privateSubnetIds}

  dbParams:
    type: aws:rds:ParameterGroup
    properties:
      name: ${namePrefix}-db-params
      family: mysql8.4
      parameters:
        - name: character_set_server
          value: utf8mb4
        - name: collation_server
          value: utf8mb4_unicode_ci
        # The image's mysql client uses skip-ssl (handover 4.1).
        - name: require_secure_transport
          value: "0"

  db:
    type: aws:rds:Instance
    properties:
      engine: mysql
      engineVersion: "8.4"
      instanceClass: ${dbInstanceClass}
      allocatedStorage: ${dbAllocatedStorage}
      maxAllocatedStorage: 500
      dbName: seek_production
      username: seek
      password: ${dbPassword}
      dbSubnetGroupName: ${dbSubnets.name}
      vpcSecurityGroupIds: ["${dataSg.id}"]
      parameterGroupName: ${dbParams.name}
      storageEncrypted: true
      backupRetentionPeriod: 14
      deletionProtection: true
      skipFinalSnapshot: false
      finalSnapshotIdentifier: ${namePrefix}-final

  # -------------------------------------------------------------------------
  # Redis: cache, sessions and throttle counters; no durable data (handover
  # 3.4). TLS-only, without an auth token.
  # -------------------------------------------------------------------------
  redisSubnets:
    type: aws:elasticache:SubnetGroup
    properties:
      name: ${namePrefix}-redis-subnets
      subnetIds: ${vpc.privateSubnetIds}

  # As in compose. The default policy only evicts keys with an expiry, and
  # SEEK's cache entries mostly have none.
  redisParams:
    type: aws:elasticache:ParameterGroup
    properties:
      name: ${namePrefix}-redis-params
      family: redis7
      parameters:
        - name: maxmemory-policy
          value: allkeys-lru

  redis:
    type: aws:elasticache:ReplicationGroup
    properties:
      description: SEEK cache and sessions
      engine: redis
      engineVersion: "7.1"
      nodeType: ${redisNodeType}
      numCacheClusters: 1
      port: 6379
      parameterGroupName: ${redisParams.name}
      subnetGroupName: ${redisSubnets.name}
      securityGroupIds: ["${dataSg.id}"]
      atRestEncryptionEnabled: true
      transitEncryptionEnabled: true

  # -------------------------------------------------------------------------
  # EFS: the shared filestore. One mount target per AZ.
  # -------------------------------------------------------------------------
  sharedFs:
    type: aws:efs:FileSystem
    properties:
      encrypted: true
      throughputMode: elastic
      tags:
        Name: ${namePrefix}-shared

  efsMountA:
    type: aws:efs:MountTarget
    properties:
      fileSystemId: ${sharedFs.id}
      subnetId: ${vpc.privateSubnetIds[0]}
      securityGroups: ["${dataSg.id}"]

  efsMountB:
    type: aws:efs:MountTarget
    properties:
      fileSystemId: ${sharedFs.id}
      subnetId: ${vpc.privateSubnetIds[1]}
      securityGroups: ["${dataSg.id}"]

  # The image runs as www-data, uid/gid 33 (handover 4.2).
  filestoreAccessPoint:
    type: aws:efs:AccessPoint
    properties:
      fileSystemId: ${sharedFs.id}
      posixUser:
        uid: 33
        gid: 33
      rootDirectory:
        path: /filestore
        creationInfo:
          ownerUid: 33
          ownerGid: 33
          permissions: "0755"

  # -------------------------------------------------------------------------
  # Solr: the derived image on an EC2 instance, index on the root volume. A
  # replaced instance means a reindex (handover 3.6).
  # -------------------------------------------------------------------------
  solrInstance:
    type: aws:ec2:Instance
    properties:
      ami: ${al2023.id}
      instanceType: ${solrInstanceType}
      subnetId: ${vpc.privateSubnetIds[0]}
      vpcSecurityGroupIds: ["${appSg.id}"]
      iamInstanceProfile: ${ssmProfile.name}
      rootBlockDevice:
        volumeSize: 50
        volumeType: gp3
        encrypted: true
      tags:
        Name: ${namePrefix}-solr
      userData: |
        #!/bin/bash
        set -euo pipefail
        dnf install -y docker
        systemctl enable --now docker
        mkdir -p /var/solr
        chown 8983:8983 /var/solr
        docker run -d --restart always --name solr \
          -p 8983:8983 \
          -v /var/solr:/var/solr \
          -e SOLR_JAVA_MEM="-Xms512m -Xmx1024m" \
          ${solrImage}
    options:
      # The AMI lookup returns the newest image, which would otherwise replace
      # the instance, and with it the index, whenever Amazon publishes one.
      ignoreChanges: ["ami"]

  # -------------------------------------------------------------------------
  # Load balancer, and the web and worker Auto Scaling groups. The instances
  # use the existing SSM instance profile.
  #
  # A change to a launch template, including a new AMI from the lookup above,
  # rolls the group's instances: each new one boots and pulls the image
  # before the old one is terminated.
  # -------------------------------------------------------------------------
  alb:
    type: awsx:lb:ApplicationLoadBalancer
    properties:
      subnetIds: ${vpc.publicSubnetIds}
      securityGroups: ["${albSg.id}"]
      listener:
        port: 80
        protocol: HTTP
      defaultTargetGroup:
        port: 3000
        protocol: HTTP
        targetType: instance
        vpcId: ${vpc.vpcId}
        deregistrationDelay: 30
        healthCheck:
          path: /up
          interval: 30
          timeout: 5
          healthyThreshold: 2
          unhealthyThreshold: 5
          matcher: "200"

  webLaunchTemplate:
    type: aws:ec2:LaunchTemplate
    properties:
      namePrefix: ${namePrefix}-web-
      imageId: ${al2023.id}
      instanceType: ${webInstanceType}
      iamInstanceProfile:
        arn: ${ssmProfile.arn}
      vpcSecurityGroupIds: ["${appSg.id}"]
      blockDeviceMappings:
        - deviceName: /dev/xvda
          ebs:
            volumeSize: 30
            volumeType: gp3
            encrypted: "true"
            deleteOnTermination: "true"
      metadataOptions:
        httpTokens: required
      tagSpecifications:
        - resourceType: instance
          tags:
            Name: ${namePrefix}-web
            Environment: ${environment}
            ManagedBy: pulumi
      userData:
        fn::toBase64:
          fn::join:
            - ""
            - - ${hostSetup}
              - |
                docker run -d --restart always --name seek --env-file /etc/seek.env \
                  -p 3000:3000 -v /mnt/filestore:/seek/filestore \
                  ${seekImage} docker/entrypoint.sh

  webGroup:
    type: aws:autoscaling:Group
    properties:
      name: ${namePrefix}-web
      minSize: ${webCount}
      maxSize: ${webCount}
      desiredCapacity: ${webCount}
      vpcZoneIdentifiers: ${vpc.privateSubnetIds}
      targetGroupArns: ["${alb.defaultTargetGroup.arn}"]
      # SEEK's first boot creates the database, which takes a while.
      healthCheckType: ELB
      healthCheckGracePeriod: 900
      launchTemplate:
        id: ${webLaunchTemplate.id}
        version: ${webLaunchTemplate.latestVersion}
      instanceRefresh:
        strategy: Rolling
        preferences:
          minHealthyPercentage: 100
          maxHealthyPercentage: 200

  workerLaunchTemplate:
    type: aws:ec2:LaunchTemplate
    properties:
      namePrefix: ${namePrefix}-worker-
      imageId: ${al2023.id}
      instanceType: ${workerInstanceType}
      iamInstanceProfile:
        arn: ${ssmProfile.arn}
      vpcSecurityGroupIds: ["${appSg.id}"]
      blockDeviceMappings:
        - deviceName: /dev/xvda
          ebs:
            volumeSize: 30
            volumeType: gp3
            encrypted: "true"
            deleteOnTermination: "true"
      metadataOptions:
        httpTokens: required
      tagSpecifications:
        - resourceType: instance
          tags:
            Name: ${namePrefix}-worker
            Environment: ${environment}
            ManagedBy: pulumi
      userData:
        fn::toBase64:
          fn::join:
            - ""
            - - ${hostSetup}
              - |
                docker run -d --restart always --name seek-workers --env-file /etc/seek.env \
                  -v /mnt/filestore:/seek/filestore \
                  ${seekImage} docker/start_workers.sh

  workerGroup:
    type: aws:autoscaling:Group
    properties:
      name: ${namePrefix}-worker
      minSize: ${workerCount}
      maxSize: ${workerCount}
      desiredCapacity: ${workerCount}
      vpcZoneIdentifiers: ${vpc.privateSubnetIds}
      healthCheckType: EC2
      launchTemplate:
        id: ${workerLaunchTemplate.id}
        version: ${workerLaunchTemplate.latestVersion}
      instanceRefresh:
        strategy: Rolling
        preferences:
          minHealthyPercentage: 100
          maxHealthyPercentage: 200

outputs:
  url: http://${alb.loadBalancer.dnsName}
  databaseEndpoint: ${db.address}
  redisEndpoint: ${redis.primaryEndpointAddress}
  sharedFsId: ${sharedFs.id}
  webGroupName: ${webGroup.name}
  workerGroupName: ${workerGroup.name}
  solrPrivateIp: ${solrInstance.privateIp}
