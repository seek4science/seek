name: biofair-mc-workflow-hub
runtime: yaml
description: >-
  AWS infrastructure for the WorkflowHub (SEEK) component of the BioFAIR
  Methods Commons Spoke, in the biofair-mc-workflow-hub account. Phase 1:
  front-end and workers on ECS Fargate, MySQL on RDS, Redis on ElastiCache,
  filestore on EFS, and Solr on its own EC2 instance, served over HTTP at the
  load balancer's own hostname.

# Design decisions, referred to below by section number ("handover 4.4"), are
# in docs/SEEK-pulumi-handover.md. What phase 2 adds is listed in README.md.

config:
  environment:
    type: string
    description: Environment name (staging, production), used in resource names.
  vpcCidr:
    type: string
  ssmInstanceProfileName:
    type: string
    default: ssm-instance-profile
    description: Existing SSM-only instance profile, looked up rather than created.
  seekImage:
    type: string
    default: fairdom/seek:main
  solrImage:
    type: string
    default: fairdom/seek-solr:main
    description: Built from solr/Dockerfile; use the same tag as seekImage.
  webCount:
    type: integer
    default: 1
    description: Keep at 1 until the schema exists (handover 4.4).
  workerCount:
    type: integer
    default: 1
  dbInstanceClass:
    type: string
    default: db.t4g.medium
  dbAllocatedStorage:
    type: integer
    default: 100
  redisNodeType:
    type: string
    default: cache.t4g.small
  solrInstanceType:
    type: string
    default: t3.medium
  dbPassword:
    type: string
    secret: true

variables:
  # e.g. biofair-mc-workflow-hub-staging
  namePrefix: ${pulumi.project}-${environment}

  ssmProfile:
    fn::invoke:
      function: aws:iam:getInstanceProfile
      arguments:
        name: ${ssmInstanceProfileName}

  al2023:
    fn::invoke:
      function: aws:ec2:getAmi
      arguments:
        mostRecent: true
        owners: ["amazon"]
        filters:
          - name: name
            values: ["al2023-ami-2023.*-x86_64"]

  # Shared by the web and worker containers. NO_ENTRYPOINT_WORKERS is only read
  # by the web entrypoint and QUIET_SUPERCRONIC only by the workers, so one list
  # serves both. REDIS_TLS needs a SEEK image with handover change 5.1.
  seekEnv:
    - name: RAILS_ENV
      value: production
    - name: RAILS_LOG_LEVEL
      value: info
    - name: SOLR_HOST
      value: ${solrInstance.privateIp}
    - name: SOLR_PORT
      value: "8983"
    - name: MYSQL_HOST
      value: ${db.address}
    - name: MYSQL_DATABASE
      value: seek_production
    - name: MYSQL_USER
      value: seek
    - name: REDIS_HOST
      value: ${redis.primaryEndpointAddress}
    - name: REDIS_TLS
      value: "1"
    - name: PUMA_WORKERS_NUM
      value: "2"
    - name: NO_ENTRYPOINT_WORKERS
      value: "1"
    - name: QUIET_SUPERCRONIC
      value: "1"

  seekSecrets:
    - name: MYSQL_PASSWORD
      valueFrom: ${dbSecret.arn}

  appVolumes:
    - name: filestore
      efsVolumeConfiguration:
        fileSystemId: ${sharedFs.id}
        transitEncryption: ENABLED
        authorizationConfig:
          accessPointId: ${filestoreAccessPoint.id}
          iam: ENABLED

  appMounts:
    - sourceVolume: filestore
      containerPath: /seek/filestore
      readOnly: false

resources:
  # -------------------------------------------------------------------------
  # Networking: two AZs, public and private subnets, a single NAT gateway.
  # -------------------------------------------------------------------------
  vpc:
    type: awsx:ec2:Vpc
    properties:
      cidrBlock: ${vpcCidr}
      numberOfAvailabilityZones: 2
      natGateways:
        strategy: Single
      tags:
        Name: ${namePrefix}

  albSg:
    type: aws:ec2:SecurityGroup
    properties:
      vpcId: ${vpc.vpcId}
      description: Public ingress to the load balancer
      ingress:
        - protocol: tcp
          fromPort: 80
          toPort: 80
          cidrBlocks: ["0.0.0.0/0"]
      egress:
        - protocol: "-1"
          fromPort: 0
          toPort: 0
          cidrBlocks: ["0.0.0.0/0"]

  # Web, workers and Solr. The data stores admit this group.
  appSg:
    type: aws:ec2:SecurityGroup
    properties:
      vpcId: ${vpc.vpcId}
      description: SEEK application tasks and Solr
      egress:
        - protocol: "-1"
          fromPort: 0
          toPort: 0
          cidrBlocks: ["0.0.0.0/0"]

  appFromAlb:
    type: aws:ec2:SecurityGroupRule
    properties:
      type: ingress
      securityGroupId: ${appSg.id}
      sourceSecurityGroupId: ${albSg.id}
      protocol: tcp
      fromPort: 3000
      toPort: 3000

  appToSolr:
    type: aws:ec2:SecurityGroupRule
    properties:
      type: ingress
      securityGroupId: ${appSg.id}
      sourceSecurityGroupId: ${appSg.id}
      protocol: tcp
      fromPort: 8983
      toPort: 8983

  dataSg:
    type: aws:ec2:SecurityGroup
    properties:
      vpcId: ${vpc.vpcId}
      description: RDS, ElastiCache and EFS, reachable only from appSg
      ingress:
        - protocol: tcp
          fromPort: 3306
          toPort: 3306
          securityGroups: ["${appSg.id}"]
        - protocol: tcp
          fromPort: 6379
          toPort: 6379
          securityGroups: ["${appSg.id}"]
        - protocol: tcp
          fromPort: 2049
          toPort: 2049
          securityGroups: ["${appSg.id}"]
      egress:
        - protocol: "-1"
          fromPort: 0
          toPort: 0
          cidrBlocks: ["0.0.0.0/0"]

  # -------------------------------------------------------------------------
  # MySQL
  # -------------------------------------------------------------------------
  dbSecret:
    type: aws:secretsmanager:Secret
    properties:
      name: ${namePrefix}/db-password
      recoveryWindowInDays: 7

  dbSecretValue:
    type: aws:secretsmanager:SecretVersion
    properties:
      secretId: ${dbSecret.id}
      secretString: ${dbPassword}

  dbSubnets:
    type: aws:rds:SubnetGroup
    properties:
      subnetIds: ${vpc.privateSubnetIds}

  dbParams:
    type: aws:rds:ParameterGroup
    properties:
      family: mysql8.4
      parameters:
        - name: character_set_server
          value: utf8mb4
        - name: collation_server
          value: utf8mb4_unicode_ci
        # The image's mysql client uses skip-ssl (handover 4.1).
        - name: require_secure_transport
          value: "0"

  db:
    type: aws:rds:Instance
    properties:
      engine: mysql
      engineVersion: "8.4"
      instanceClass: ${dbInstanceClass}
      allocatedStorage: ${dbAllocatedStorage}
      maxAllocatedStorage: 500
      dbName: seek_production
      username: seek
      password: ${dbPassword}
      dbSubnetGroupName: ${dbSubnets.name}
      vpcSecurityGroupIds: ["${dataSg.id}"]
      parameterGroupName: ${dbParams.name}
      storageEncrypted: true
      backupRetentionPeriod: 14
      deletionProtection: true
      skipFinalSnapshot: false
      finalSnapshotIdentifier: ${namePrefix}-final

  # -------------------------------------------------------------------------
  # Redis: cache, sessions and throttle counters; no durable data (handover
  # 3.4). TLS-only, without an auth token.
  # -------------------------------------------------------------------------
  redisSubnets:
    type: aws:elasticache:SubnetGroup
    properties:
      subnetIds: ${vpc.privateSubnetIds}

  # As in compose. The default policy only evicts keys with an expiry, and
  # SEEK's cache entries mostly have none.
  redisParams:
    type: aws:elasticache:ParameterGroup
    properties:
      family: redis7
      parameters:
        - name: maxmemory-policy
          value: allkeys-lru

  redis:
    type: aws:elasticache:ReplicationGroup
    properties:
      description: SEEK cache and sessions
      engine: redis
      engineVersion: "7.1"
      nodeType: ${redisNodeType}
      numCacheClusters: 1
      port: 6379
      parameterGroupName: ${redisParams.name}
      subnetGroupName: ${redisSubnets.name}
      securityGroupIds: ["${dataSg.id}"]
      atRestEncryptionEnabled: true
      transitEncryptionEnabled: true

  # -------------------------------------------------------------------------
  # EFS: the shared filestore. One mount target per AZ.
  # -------------------------------------------------------------------------
  sharedFs:
    type: aws:efs:FileSystem
    properties:
      encrypted: true
      throughputMode: elastic
      tags:
        Name: ${namePrefix}-shared

  efsMountA:
    type: aws:efs:MountTarget
    properties:
      fileSystemId: ${sharedFs.id}
      subnetId: ${vpc.privateSubnetIds[0]}
      securityGroups: ["${dataSg.id}"]

  efsMountB:
    type: aws:efs:MountTarget
    properties:
      fileSystemId: ${sharedFs.id}
      subnetId: ${vpc.privateSubnetIds[1]}
      securityGroups: ["${dataSg.id}"]

  # The image runs as www-data, uid/gid 33 (handover 4.2).
  filestoreAccessPoint:
    type: aws:efs:AccessPoint
    properties:
      fileSystemId: ${sharedFs.id}
      posixUser:
        uid: 33
        gid: 33
      rootDirectory:
        path: /filestore
        creationInfo:
          ownerUid: 33
          ownerGid: 33
          permissions: "0755"

  # -------------------------------------------------------------------------
  # Solr: the derived image on an EC2 instance, index on the root volume. A
  # replaced instance means a reindex (handover 3.6).
  # -------------------------------------------------------------------------
  solrInstance:
    type: aws:ec2:Instance
    properties:
      ami: ${al2023.id}
      instanceType: ${solrInstanceType}
      subnetId: ${vpc.privateSubnetIds[0]}
      vpcSecurityGroupIds: ["${appSg.id}"]
      iamInstanceProfile: ${ssmProfile.name}
      rootBlockDevice:
        volumeSize: 50
        volumeType: gp3
        encrypted: true
      tags:
        Name: ${namePrefix}-solr
      userData: |
        #!/bin/bash
        set -euo pipefail
        dnf install -y docker
        systemctl enable --now docker
        mkdir -p /var/solr
        chown 8983:8983 /var/solr
        docker run -d --restart always --name solr \
          -p 8983:8983 \
          -v /var/solr:/var/solr \
          -e SOLR_JAVA_MEM="-Xms512m -Xmx1024m" \
          ${solrImage}
    options:
      # The AMI lookup returns the newest image, which would otherwise replace
      # the instance, and with it the index, whenever Amazon publishes one.
      ignoreChanges: ["ami"]

  # -------------------------------------------------------------------------
  # ECS: cluster, load balancer, web and worker services.
  #
  # awsx:ecs:FargateService creates a task execution role and a task role per
  # service, which the Developer permission set may not allow; see README.md.
  # -------------------------------------------------------------------------
  cluster:
    type: aws:ecs:Cluster
    properties:
      name: ${namePrefix}
      settings:
        - name: containerInsights
          value: enabled

  alb:
    type: awsx:lb:ApplicationLoadBalancer
    properties:
      subnetIds: ${vpc.publicSubnetIds}
      securityGroups: ["${albSg.id}"]
      listener:
        port: 80
        protocol: HTTP
      defaultTargetGroup:
        port: 3000
        protocol: HTTP
        targetType: ip
        vpcId: ${vpc.vpcId}
        deregistrationDelay: 30
        healthCheck:
          path: /up
          interval: 30
          timeout: 5
          healthyThreshold: 2
          unhealthyThreshold: 5
          matcher: "200"

  web:
    type: awsx:ecs:FargateService
    properties:
      cluster: ${cluster.arn}
      desiredCount: ${webCount}
      networkConfiguration:
        subnets: ${vpc.privateSubnetIds}
        securityGroups: ["${appSg.id}"]
      taskDefinitionArgs:
        cpu: "1024"
        memory: "2048"
        volumes: ${appVolumes}
        containers:
          seek:
            name: seek
            image: ${seekImage}
            essential: true
            command: ["docker/entrypoint.sh"]
            portMappings:
              - containerPort: 3000
                targetGroup: ${alb.defaultTargetGroup}
            environment: ${seekEnv}
            secrets: ${seekSecrets}
            mountPoints: ${appMounts}
            healthCheck:
              command: ["CMD-SHELL", "curl -f http://localhost:3000/up || exit 1"]
              interval: 30
              timeout: 5
              retries: 5
              startPeriod: 60

  workers:
    type: awsx:ecs:FargateService
    properties:
      cluster: ${cluster.arn}
      desiredCount: ${workerCount}
      networkConfiguration:
        subnets: ${vpc.privateSubnetIds}
        securityGroups: ["${appSg.id}"]
      taskDefinitionArgs:
        cpu: "1024"
        memory: "2048"
        volumes: ${appVolumes}
        containers:
          seek-workers:
            name: seek-workers
            image: ${seekImage}
            essential: true
            command: ["docker/start_workers.sh"]
            environment: ${seekEnv}
            secrets: ${seekSecrets}
            mountPoints: ${appMounts}
            healthCheck:
              command: ["CMD", "bash", "script/check_worker_pids.sh"]
              interval: 30
              timeout: 10
              retries: 5
              startPeriod: 60

outputs:
  url: http://${alb.loadBalancer.dnsName}
  databaseEndpoint: ${db.address}
  redisEndpoint: ${redis.primaryEndpointAddress}
  sharedFsId: ${sharedFs.id}
  clusterName: ${cluster.name}
  solrPrivateIp: ${solrInstance.privateIp}
