x-shared:
  seek_base: &seek_base
    # build: .
    image: fairdom/seek:kg

    restart: always
    environment: &seek_base_env
      RAILS_ENV: production
      SOLR_PORT: 8983
      SOLR_HOST: solr
      RAILS_LOG_LEVEL: info # debug, info, warn, error or fatal
    env_file:
      - docker/db.env
      - docker/redis.env
      - docker/virtuoso.env
    volumes:
      - kg-seek-filestore:/seek/filestore
      - kg-seek-cache:/seek/tmp/cache
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
      virtuoso:
        condition: service_started

services:
  db:
    # Database implementation, in this case MySQL
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --log-error-verbosity=1
      # Optional: Enable mysql_native_password if needed for legacy apps
      # - --mysql-native-password=ON
      # Optional: restrict foreign keys if needed
      # - --restrict-fk-on-non-standard-key=OFF
    restart: always
    stop_grace_period: 1m30s
    env_file:
      - docker/db.env
    volumes:
      - kg-seek-mysql-db:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis_store:
    image: redis:8.6-alpine
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy allkeys-lru
    env_file:
      - docker/redis.env
    volumes:
      - kg-seek-redis-data:/data
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  seek:
    # The SEEK application
    <<: *seek_base
    command: docker/entrypoint.sh
    ports:
      - "3000:3000"
    environment:
      <<: *seek_base_env
      NO_ENTRYPOINT_WORKERS: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  seek_workers:
    # The SEEK delayed job workers
    <<: *seek_base
    environment:
      <<: *seek_base_env
      QUIET_SUPERCRONIC: 1
    command: docker/start_workers.sh

  solr:
    image: fairdom/seek-solr:main
    restart: always
    environment:
      SOLR_JAVA_MEM: -Xms512m -Xmx1024m
    volumes:
      - kg-seek-solr-data:/var/solr/

  virtuoso:
    image: openlink/virtuoso-opensource-7:7.2.15
    restart: always
    ports:
      # HTTP: the SPARQL endpoint (/sparql) and Conductor admin UI (/conductor). Set VIRTUOSO_PORT to use another
      # host port, e.g. if 8890 is already in use
      - "${VIRTUOSO_PORT:-8890}:8890"
      # isql admin port, only reachable from the host itself as it accepts the DBA password
      - "127.0.0.1:${VIRTUOSO_ISQL_PORT:-1111}:1111"
    environment:
      DBA_PASSWORD: CHANGE_ME
    volumes:
      - kg-seek-virtuoso-data:/database

volumes:
  kg-seek-filestore:
  kg-seek-mysql-db:
  kg-seek-solr-data:
  kg-seek-cache:
  kg-seek-virtuoso-data:
  kg-seek-redis-data:
